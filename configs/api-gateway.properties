# ─── API Gateway specific config ────────────────

server.port=8080
spring.application.name=api-gateway

# Rate limiting
gateway.rate-limit.requests-per-second=100
gateway.rate-limit.burst-capacity=200

# Timeout
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=10s

# JWT
jwt.secret=myLibraryJwtSecretKey123456789
spring.cloud.gateway.routes[0].id=book-service
spring.cloud.gateway.routes[0].uri=lb://book-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/books/**

spring.cloud.gateway.routes[1].id=borrow-service
spring.cloud.gateway.routes[1].uri=lb://borrow-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/borrow/**

spring.cloud.gateway.routes[2].id=member-service
spring.cloud.gateway.routes[2].uri=lb://member-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/members/**
